name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · Swift 6 · warnings are errors
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Swift version
        run: swift --version

      # Clean checkout, so "Build complete" here is real evidence rather than
      # an up-to-date no-op. `-warnings-as-errors` makes the zero-warning claim
      # in the README machine-enforced instead of asserted in prose.
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

  macos:
    name: macOS · build + test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
